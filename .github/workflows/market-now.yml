name: Market Summary on Demand

# Started by the Cloudflare Worker in bot/worker.js when someone uses the
# /market slash command. Draws the current market summary and fills in the
# command's "thinking..." placeholder with it.
on:
  workflow_dispatch:
    inputs:
      application_id:
        description: "Discord application ID (sent by the bot)"
        required: true
        type: string
      interaction_token:
        description: "Discord interaction token (sent by the bot)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The token lets anyone edit this one reply for 15 minutes, and this
      # repository's logs are public. It is read from the event file rather
      # than written into a command, so it never appears in the log, and then
      # masked for every later step.
      - name: Load the interaction
        run: |
          token=$(jq -r '.inputs.interaction_token' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$token"
          echo "INTERACTION_TOKEN=$token" >> "$GITHUB_ENV"
          echo "DISCORD_APPLICATION_ID=$(jq -r '.inputs.application_id' "$GITHUB_EVENT_PATH")" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/market_close.txt

      # The chart is labelled in Chinese; the runner image ships no CJK font.
      # Skipping the package index refresh saves several seconds when the
      # runner's index is still current.
      - name: Install Chinese font
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk)

      - name: Install dependencies
        run: pip install -r requirements/market_close.txt

      - name: Draw the summary and reply
        run: python -m market_pulse.market_close

      - name: Tell the user if it failed
        if: failure()
        run: |
          curl -sS -X PATCH \
            -H "Content-Type: application/json" \
            -d '{"content": "生成失败，请稍后再试。"}' \
            "https://discord.com/api/v10/webhooks/${DISCORD_APPLICATION_ID}/${INTERACTION_TOKEN}/messages/@original" \
            > /dev/null
