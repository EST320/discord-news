name: Fear and Greed Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests matplotlib numpy

      - name: Run Fear and Greed tracker
        run: python -m discord_news.fear_greed
        env:
          DISCORD_WEBHOOK_URL_FEARGREED: ${{ secrets.DISCORD_WEBHOOK_URL_FEARGREED }}

      - name: Save state
        working-directory: state
        run: |
          git config user.name "EST"
          git config user.email "55035415+EST320@users.noreply.github.com"
          git add seen_feargreed.json
          git diff --cached --quiet && exit 0
          git commit -m "Update fear and greed state"
          git pull --rebase origin state && git push origin HEAD:state
