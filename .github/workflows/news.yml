name: Wallstreetcn US-Stock to Discord

on:
  workflow_dispatch:

concurrency:
  group: wallstreetcn-us-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements/base.txt

      - name: Fetch US-stock live news and post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m market_pulse.wallstreetcn us

      - name: Save state
        run: bash scripts/save_state.sh seen_us.json
