name: US Market Close Summary

# Triggered by the external scheduler at 4:15 pm New York time on weekdays
# (see README, "Triggering"). GitHub's own schedule is not used: it is
# best-effort and can run late or not at all.
on:
  workflow_dispatch:
  # A change to the tracker triggers a dry run: fetch and render, post nothing.
  push:
    branches: [main]
    paths:
      - "market_pulse/market_close.py"
      - "market_pulse/fonts.py"
      - "market_pulse/theme.py"
      - "requirements/market_close.txt"
      - ".github/workflows/market-close.yml"

permissions:
  contents: read

jobs:
  post-market-close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The chart is labelled in Chinese; the runner image ships no CJK font.
      - name: Install Chinese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements/market_close.txt

      - name: Build and post market close summary
        env:
          # Shares the Fear & Greed channel unless a dedicated webhook is set.
          DISCORD_WEBHOOK_URL_MARKET: ${{ secrets.DISCORD_WEBHOOK_URL_MARKET || secrets.DISCORD_WEBHOOK_URL_FEARGREED }}
          DRY_RUN: ${{ github.event_name == 'push' }}
        run: python -m market_pulse.market_close
