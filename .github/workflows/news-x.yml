name: X Tracker to Discord

on:
  workflow_dispatch:

concurrency:
  group: x-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-tweets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests git+https://github.com/JustAnotherArchivist/snscrape.git

      - name: Fetch X posts and post
        env:
          DISCORD_WEBHOOK_URL_TRENDSPIDER: ${{ secrets.DISCORD_WEBHOOK_URL_TRENDSPIDER }}
          DISCORD_WEBHOOK_URL_COLE: ${{ secrets.DISCORD_WEBHOOK_URL_COLE }}
          DISCORD_WEBHOOK_URL_SPECUYCKY: ${{ secrets.DISCORD_WEBHOOK_URL_SPECUYCKY }}
        run: python -m discord_news.x_tracker

      - name: Save state
        working-directory: state
        run: |
          git config user.name "EST"
          git config user.email "55035415+EST320@users.noreply.github.com"
          git add seen_x.json
          git diff --cached --quiet && exit 0
          git commit -m "Update X tracker state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin state && git push origin HEAD:state && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
