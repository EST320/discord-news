name: Wallstreetcn HK-Stock to Discord

on:
  workflow_dispatch:

concurrency:
  group: wallstreetcn-hk-stock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch HK-stock live news and post
        env:
          DISCORD_WEBHOOK_URL_HK: ${{ secrets.DISCORD_WEBHOOK_URL_HK }}
        run: python -m discord_news.wallstreetcn hk

      - name: Save state
        working-directory: state
        run: |
          git config user.name "EST"
          git config user.email "55035415+EST320@users.noreply.github.com"
          git add seen_hk.json
          git diff --cached --quiet && exit 0
          git commit -m "Update HK-stock state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin state && git push origin HEAD:state && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
