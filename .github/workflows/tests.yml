name: Tests

# State commits made by the tracker workflows only touch state/*.json, so they
# never match these paths.
on:
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run tests
        run: python -m unittest discover -s tests -v
