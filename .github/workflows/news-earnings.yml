name: Weekly Earnings Calendar to Discord

on:
  workflow_dispatch:
  # A change to the tracker triggers a dry run: fetch and render, post nothing.
  push:
    branches: [main]
    paths:
      - "market_pulse/earnings_calendar.py"
      - "market_pulse/theme.py"
      - "market_pulse/fonts.py"
      - "requirements/earnings.txt"
      - ".github/workflows/news-earnings.yml"

permissions:
  contents: read

jobs:
  post-earnings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The chart shares the market close image's typeface, which needs a CJK font.
      - name: Install chart font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements/earnings.txt

      - name: Fetch and post earnings calendar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DISCORD_WEBHOOK_URL_EARNINGS: ${{ secrets.DISCORD_WEBHOOK_URL_EARNINGS }}
          DRY_RUN: ${{ github.event_name == 'push' }}
        run: python -m market_pulse.earnings_calendar
