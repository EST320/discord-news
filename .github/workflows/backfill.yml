name: Backfill Missed News (manual)

# Manual trigger only: never runs on its own and does not interfere with the
# three live news workflows.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Backfill news from the last N hours"
        required: true
        default: "6"
      channels:
        description: "Channels to backfill (comma-separated: us,a,hk)"
        required: true
        default: "us,a,hk"
      dry_run:
        description: "Dry run: only list what would be sent, send nothing"
        type: boolean
        required: true
        default: true

concurrency:
  group: wallstreetcn-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Backfill
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_A: ${{ secrets.DISCORD_WEBHOOK_URL_A }}
          DISCORD_WEBHOOK_URL_HK: ${{ secrets.DISCORD_WEBHOOK_URL_HK }}
          HOURS: ${{ inputs.hours }}
          CHANNELS: ${{ inputs.channels }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python -m discord_news.backfill

      - name: Save state
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_us.json state/seen_a.json state/seen_hk.json
          git diff --cached --quiet && exit 0
          git commit -m "Backfill missed news state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
